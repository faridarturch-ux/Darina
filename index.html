
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Для моей Дарины ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  text-align: center;
  background: radial-gradient(ellipse at top, #263b72, #080b20 75%);
  overflow-x: hidden;
}

.stars {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    radial-gradient(2px 2px at 20% 30%, white 99%, transparent),
    radial-gradient(1px 1px at 70% 20%, white 99%, transparent),
    radial-gradient(2px 2px at 80% 70%, white 99%, transparent),
    radial-gradient(1px 1px at 40% 80%, white 99%, transparent),
    radial-gradient(2px 2px at 10% 60%, white 99%, transparent);
  background-size: 170px 170px;
  animation: twinkle 4s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .35; }
  to { opacity: 1; }
}

main {
  position: relative;
  width: 100%;
  max-width: 600px;
  margin: auto;
  padding: 65px 22px 50px;
}

.moon {
  font-size: 65px;
  filter: drop-shadow(0 0 20px #fff1b0);
}

h1 {
  font-size: clamp(32px, 8vw, 47px);
  color: #ffd6e7;
  text-shadow: 0 0 25px #ff579c;
  margin: 20px 0;
}

p {
  font-size: 18px;
  line-height: 1.8;
}

.heart {
  font-size: 75px;
  margin: 25px 0;
  animation: beat 1.2s infinite;
  filter: drop-shadow(0 0 18px #ff276c);
}

@keyframes beat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.14); }
}

button {
  display: block;
  width: 100%;
  padding: 16px;
  margin: 14px 0;
  border: 1px solid #ffb4d1;
  border-radius: 18px;
  background: #ffffff12;
  color: white;
  font-size: 16px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

button:active {
  background: #ff4f8b55;
}

#message {
  min-height: 95px;
  margin: 25px 0;
  color: #ffd6e7;
  font-size: 19px;
  line-height: 1.7;
}

footer {
  color: #c3c7e8;
  font-size: 14px;
  margin-top: 40px;
}
</style>
</head>
<body>
<div class="stars"></div>

<main>
  <div class="moon">🌙</div>

  <h1>Для моей Дарины ❤️</h1>

  <p>
    Среди миллиардов звёзд<br>
    я нашёл именно тебя.
  </p>

  <div class="heart">❤️</div>

  <p>
    Этот маленький мир создан<br>
    специально для тебя.
  </p>

  <button onclick="showMessage(0)">
    💌 Почему именно ты?
  </button>

  <button onclick="showMessage(1)">
    🌹 Что я хочу тебе сказать?
  </button>

  <button onclick="showMessage(2)">
    ✨ Моё самое большое желание
  </button>

  <button onclick="showMessage(3)">
    ❤️ Нажми, если любишь меня
  </button>

  <div id="message">
    Дарина, здесь спрятаны мои чувства к тебе...
  </div>

  <footer>
    Создано с любовью. Только для тебя. ❤️
  </footer>
</main>

<script>
const messages = [
  "Потому что никто другой не заставляет моё сердце биться так, как ты. Ты особенная для меня, Дарина. ❤️",
  "Я хочу, чтобы ты знала: ты очень дорога мне. Мне хочется дарить тебе улыбки, заботу и моменты, которые мы будем вспоминать вместе. 💋",
  "Моё желание — быть рядом с тобой, поддерживать тебя и делать всё, чтобы ты чувствовала себя любимой. 🌹",
  "Тогда отправляю тебе миллион поцелуев! 💋❤️ Ты — моя любимая девочка, Дарина! 💖"
];

function showMessage(number) {
  document.getElementById("message").textContent =
    messages[number];
}

document.addEventListener("click", function(event) {
  if (event.target.tagName === "BUTTON") {
    const heart = document.createElement("div");
    heart.textContent = "❤️";
    heart.style.cssText =
      "position:fixed;left:" + (10 + Math.random()*80) +
      "%;top:" + (20 + Math.random()*60) +
      "%;font-size:28px;pointer-events:none;z-index:10;" +
      "animation:twinkle 1s ease-out forwards";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 1200);
  }
});
</script>
</body>
</html>
